version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kclc_db}
      POSTGRES_USER: ${POSTGRES_USER:-kclc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kclc_secure_password_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kclc_user} -d ${POSTGRES_DB:-kclc_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: always
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn kclc.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2 --timeout 120 --access-logfile - --error-logfile -"
    volumes:
      - media_volume:/app/media
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-production-secret-key-change-me}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost,https://localhost}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-kclc_user}:${POSTGRES_PASSWORD:-kclc_secure_password_change_me}@db:5432/${POSTGRES_DB:-kclc_db}
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-False}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.mail.ru}
      - EMAIL_PORT=${EMAIL_PORT:-465}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL:-True}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-bot.kclc@mail.ru}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-KCLC <bot.kclc@mail.ru>}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_volume:
