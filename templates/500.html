{% extends "base.html" %}

{% block title %}Ошибка сервера{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-20 text-center">
    <h1 class="text-6xl font-bold text-red-500 mb-6">500</h1>
    <h2 class="text-2xl font-semibold text-navy dark:text-white mb-4">Внутренняя ошибка сервера</h2>
    <p class="text-gray-600 dark:text-gray-400 mb-8 max-w-md mx-auto">
        К сожалению, на сервере произошла ошибка. Мы уже работаем над её устранением. Пожалуйста, попробуйте зайти позже.
    </p>
    <a href="{% url 'home' %}" class="inline-flex items-center gap-2 bg-primary text-white px-6 py-3 rounded-xl font-medium hover:bg-primary-hover transition-colors shadow-lg">
        <span class="material-symbols-outlined">home</span>
        На главную
    </a>
</div>
{% endblock %}
