{% extends 'library/base_library.html' %}

{% block title %}{{ room.name }} | Общение{% endblock %}

{% block library_content %}
<div class="max-w-5xl mx-auto pb-10">
    <div class="flex flex-col h-[85vh] bg-white rounded-[2rem] shadow-[0_12px_40px_rgba(0,0,0,0.06)] border border-navy/5 overflow-hidden relative">
        
        <!-- Header Sticky -->
        <div class="px-6 py-4 border-b border-gray-100 bg-white/80 backdrop-blur-xl z-20 flex items-center shadow-sm">
            <a href="{% url 'chat_list' %}" class="w-10 h-10 flex items-center justify-center rounded-xl bg-gray-50 hover:bg-gray-100 text-navy transition-colors mr-4 group">
                <span class="material-symbols-outlined group-hover:-translate-x-1 transition-transform">arrow_back</span>
            </a>
            
            <div class="w-12 h-12 rounded-2xl flex items-center justify-center shrink-0 mr-4 bg-primary/10 text-primary shadow-inner">
                <span class="material-symbols-outlined text-2xl">{{ room.icon }}</span>
            </div>
            
            <div class="flex-1 min-w-0">
                <h2 class="font-bold text-xl text-navy leading-none truncate">{{ room.name }}</h2>
                {% if room.description %}
                <p class="text-sm text-txt-sub truncate mt-1">{{ room.description }}</p>
                {% else %}
                <p class="text-sm text-success font-medium flex items-center gap-1 mt-1">
                    <span class="w-2 h-2 rounded-full bg-success inline-block"></span>
                    Часовня открыта
                </p>
                {% endif %}
            </div>
            
            <div class="hidden sm:flex items-center gap-2">
                <button class="w-10 h-10 rounded-full hover:bg-gray-50 flex items-center justify-center text-gray-400 hover:text-navy transition-colors">
                    <span class="material-symbols-outlined text-xl">search</span>
                </button>
                <button class="w-10 h-10 rounded-full hover:bg-gray-50 flex items-center justify-center text-gray-400 hover:text-navy transition-colors">
                    <span class="material-symbols-outlined text-xl">more_vert</span>
                </button>
            </div>
        </div>

        <!-- Chat Background Wrapper (Optional slight beige or pattern) -->
        <div class="absolute inset-0 top-[81px] bottom-[76px] bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] opacity-[0.03] pointer-events-none z-0"></div>

        <!-- Messages Area -->
        <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-6 bg-[#faf9f7] z-10 scroll-smooth">
            <div class="flex justify-center my-6">
                <div class="px-4 py-1.5 rounded-full bg-navy/5 border border-navy/10 text-xs font-semibold text-navy/50 uppercase tracking-widest backdrop-blur-sm">
                    Начало общения
                </div>
            </div>
            <!-- Dynamic JS render here -->
        </div>

        <!-- Input Area (Floating effect) -->
        <div class="p-4 bg-white/90 backdrop-blur-xl border-t border-gray-100 z-20 shadow-[0_-10px_30px_rgba(0,0,0,0.02)]">
            <div class="flex items-end gap-3 max-w-4xl mx-auto bg-gray-50 rounded-3xl p-2 border border-gray-100 focus-within:border-primary/30 focus-within:bg-white focus-within:shadow-[0_4px_20px_rgba(201,168,76,0.1)] transition-all">
                
                <button class="w-10 h-10 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-primary transition-colors shrink-0">
                    <span class="material-symbols-outlined">sentiment_satisfied</span>
                </button>
                
                <textarea id="chat-input" rows="1" class="flex-1 resize-none bg-transparent py-3 px-2 focus:outline-none text-navy placeholder-gray-400 max-h-32" placeholder="Написать сообщение..."></textarea>
                
                <button id="send-btn" class="w-12 h-12 flex items-center justify-center rounded-full shrink-0 bg-primary hover:bg-primary-hover text-navy shadow-[0_4px_12px_rgba(201,168,76,0.4)] transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                    <span class="material-symbols-outlined text-xl" style="transform: translateX(2px); font-variation-settings: 'FILL' 1;">send</span>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- AJAX Long Polling Script -->
<script>
    const roomId = '{{ room.id }}';
    const currentUserId = '{{ user.id }}';
    const messagesContainer = document.getElementById('chat-messages');
    const inputField = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    
    let lastMessageId = 0;
    
    // Auto-height textarea
    inputField.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight < 128 ? this.scrollHeight : 128) + 'px';
        if (this.value.trim() !== '') {
            sendBtn.classList.remove('opacity-50');
        } else {
            sendBtn.classList.add('opacity-50');
        }
    });
    
    inputField.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
    
    sendBtn.addEventListener('click', sendMessage);
    
    // Disable send by default until text typed
    sendBtn.classList.add('opacity-50');

    function sendMessage() {
        const text = inputField.value.trim();
        if (!text) return;
        
        inputField.disabled = true;
        sendBtn.disabled = true;
        
        fetch(`/api/chat/${roomId}/send/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({text: text})
        })
        .then(res => res.json())
        .then(data => {
            inputField.disabled = false;
            sendBtn.disabled = false;
            if (data.status === 'ok') {
                inputField.value = '';
                inputField.style.height = 'auto';
                sendBtn.classList.add('opacity-50');
                fetchMessages(); 
            } else {
                console.error(data.message);
            }
            inputField.focus();
        })
        .catch(err => {
            console.error(err);
            inputField.disabled = false;
            sendBtn.disabled = false;
        });
    }
    
    function fetchMessages() {
        fetch(`/api/chat/${roomId}/messages/?last_id=${lastMessageId}`)
        .then(res => res.json())
        .then(data => {
            if (data.messages && data.messages.length > 0) {
                let shouldScroll = false;
                if (messagesContainer.scrollHeight - messagesContainer.scrollTop <= messagesContainer.clientHeight + 100) {
                    shouldScroll = true;
                }
                
                data.messages.forEach(msg => {
                    if (msg.id > lastMessageId) {
                        lastMessageId = msg.id;
                        renderMessage(msg);
                    }
                });
                
                if (shouldScroll) {
                    scrollToBottom();
                }
            }
        })
        .catch(err => console.error("Polling error:", err));
    }
    
    function renderMessage(msg) {
        const row = document.createElement('div');
        row.className = `flex w-full ${msg.is_me ? 'justify-end' : 'justify-start'}`;
        
        // Bubble Layout
        const bubbleWrap = document.createElement('div');
        bubbleWrap.className = `flex flex-col relative max-w-[85%] md:max-w-[70%] group`;
        
        // Avatar (Only for others) - Optional, adds great aesthetics
        if (!msg.is_me) {
            const avatar = document.createElement('div');
            // Simplified avatar bubble next to message
            avatar.className = 'w-8 h-8 rounded-full bg-navy text-white flex items-center justify-center font-bold text-xs uppercase absolute -left-10 bottom-0 shadow-sm hidden sm:flex';
            avatar.textContent = msg.author_username.charAt(0);
            bubbleWrap.appendChild(avatar);
            bubbleWrap.classList.add('sm:ml-10'); // adjust margin
        }

        const bubble = document.createElement('div');
        bubble.className = `px-5 py-3 shadow-sm text-[15px] leading-relaxed relative ${
            msg.is_me 
            ? 'bg-navy text-white rounded-[20px] rounded-br-md' 
            : 'bg-white border border-gray-100 text-navy rounded-[20px] rounded-bl-md'
        }`;
        
        if (!msg.is_me) {
            const authorEl = document.createElement('div');
            authorEl.className = 'text-[12px] font-bold mb-1 text-primary tracking-wide';
            authorEl.textContent = msg.author_username;
            bubble.appendChild(authorEl);
        }
        
        const textEl = document.createElement('span');
        textEl.className = "whitespace-pre-wrap font-medium";
        textEl.textContent = msg.text;
        bubble.appendChild(textEl);
        
        // Timestamps inline bottom-right float
        const timeEl = document.createElement('span');
        timeEl.className = `inline-block text-[10px] ml-3 float-right translate-y-1 font-semibold ${msg.is_me ? 'text-white/60' : 'text-gray-400'}`;
        timeEl.textContent = msg.created_at;
        bubble.appendChild(timeEl);
        
        bubbleWrap.appendChild(bubble);
        row.appendChild(bubbleWrap);
        messagesContainer.appendChild(row);
    }
    
    function scrollToBottom() {
        messagesContainer.scrollTo({
            top: messagesContainer.scrollHeight,
            behavior: 'smooth'
        });
    }
    
    fetchMessages();
    setInterval(fetchMessages, 3000); 
</script>
{% endblock %}
