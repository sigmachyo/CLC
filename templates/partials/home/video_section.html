{% load static %}
<section class="snap-sec" id="sec-video" aria-label="Прошедшее служение">
  <div class="snap-sec-inner">
    <div class="section-content section-content--video">
      <h2 class="section-heading">Прошедшее служение</h2>
      <div class="up-card">
        <div class="up-video-wrap" id="prev-player" aria-label="Плеер записи">
          <div class="vid-player-poster" style="background-image: url('{% static "img/og-image.jpg" %}');"></div>
          <div class="vid-player-gradient"></div>
          <div class="vid-player-loading" id="prev-fallback" aria-live="polite">
            <span class="material-symbols-outlined vid-loading-icon">hourglass_empty</span>
            <span class="vid-loading-text">Загружаем запись богослужения…</span>
          </div>
        </div>
        <div class="up-meta">
          <div class="up-info">
            <h3 class="up-title" id="prev-date" aria-live="polite">Воскресное служение</h3>
            <div class="up-status">
              KCLC Красноярск &nbsp;&middot;&nbsp; Запись
            </div>
          </div>
          <div class="up-actions">
            <a href="https://rutube.ru/channel/39733690/" class="up-btn up-btn--ru" id="prev-ru-btn" target="_blank" rel="noopener" title="Смотреть на Rutube">
              <span class="material-symbols-outlined fill-icon">smart_display</span>
            </a>
            <a href="https://www.youtube.com/@kclcfamily/videos" class="up-btn up-btn--yt" id="prev-yt-btn" target="_blank" rel="noopener" title="Смотреть на YouTube">
              <span class="material-symbols-outlined fill-icon">play_circle</span>
            </a>
            <button class="up-btn up-btn--share" aria-label="Поделиться">
              <span class="material-symbols-outlined">share</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
