{% load static %}
<section class="snap-sec" id="sec-events" aria-label="События">
  <div class="snap-sec-inner events-inner">
    <div class="events-container">
      <div class="events-slider" id="eventsSlider">
        {% if featured_events %}
          {% for event in featured_events %}
          <div class="event-slide">
              <a href="{% if event.slug %}{% url 'event_detail' slug=event.slug %}{% else %}#{% endif %}">
                  {% if event.image %}
                    <img src="{{ event.image.url }}" alt="{{ event.title }}">
                  {% else %}
                    <div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:#fff; background:#2c3e50;">
                        <h3>{{ event.title }}</h3>
                    </div>
                  {% endif %}
                  <div class="event-slide-overlay">
                    <span class="event-slide-title">{{ event.title }}</span>
                    <span class="event-slide-cta">Подробнее <span aria-hidden="true">&#8594;</span></span>
                  </div>
              </a>
          </div>
          {% endfor %}
        {% else %}
          <div class="event-slide">
              <a href="#" target="_blank" rel="noopener">
                  <div class="event-fallback-art" aria-label="Альфа конференция"></div>
                  <div class="event-slide-overlay"><span class="event-slide-title">Альфа-конференция</span><span class="event-slide-cta">Подробнее <span aria-hidden="true">&#8594;</span></span></div>
              </a>
          </div>
          <div class="event-slide">
              <a href="#" target="_blank" rel="noopener">
                  <div class="event-fallback-art" aria-label="Перезагрузка"></div>
                    <div class="event-slide-overlay"><span class="event-slide-title">Перезагрузка</span><span class="event-slide-cta">Подробнее <span aria-hidden="true">&#8594;</span></span></div>
              </a>
          </div>
          <div class="event-slide">
              <a href="#" target="_blank" rel="noopener">
                  <div class="event-fallback-art" aria-label="ИДТИ"></div>
                    <div class="event-slide-overlay"><span class="event-slide-title">ИДТИ</span><span class="event-slide-cta">Подробнее <span aria-hidden="true">&#8594;</span></span></div>
              </a>
          </div>
        {% endif %}
      </div>
      
      <!-- Dots indicator -->
      <div class="events-dots" id="eventsDots" aria-hidden="true"></div>
      
    </div>
  </div>
</section>
