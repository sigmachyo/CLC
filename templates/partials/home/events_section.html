{% load static %}
<section class="snap-sec" id="sec-events" aria-label="События">
  <div class="snap-sec-inner events-inner">
    <div class="events-container">
      <div class="events-slider" id="eventsSlider">
        {% if featured_events %}
          {% for event in featured_events %}
          <div class="event-slide">
              <a href="{% if event.slug %}{% url 'event_detail' slug=event.slug %}{% else %}#{% endif %}">
                  {% if event.image %}
                    <img src="{{ event.image.url }}" alt="{{ event.title }}">
                  {% else %}
                    <div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:#fff; background:#2c3e50;">
                        <h3>{{ event.title }}</h3>
                    </div>
                  {% endif %}
                  <div class="event-slide-overlay">
                    <span class="event-slide-title">{{ event.title }}</span>
                    <span class="event-slide-cta">Подробнее <span aria-hidden="true">&#8594;</span></span>
                  </div>
              </a>
          </div>
          {% endfor %}
        {% else %}
          <div class="event-slide">
                <a href="http://new.kclc.ru/events/go/" target="_blank" rel="noopener">
                  <img src="https://kclc.ru/wp-content/uploads/2026/04/FCj8S39nKv27LRPj1ssnUP1YYINeUZKyxaJ1JNnD6aN6SRsQDdjT1zRZpbIR1ztQQJ4woCegZ4DtyymaXaXl2Lp4-1.jpg" alt="Время идти">
                  <div class="event-slide-overlay"><span class="event-slide-title">Время идти</span><span class="event-slide-cta">Подробнее <span aria-hidden="true">&#8594;</span></span></div>
              </a>
          </div>
          <div class="event-slide">
              <a href="http://new.kclc.ru/events/reboot/" target="_blank" rel="noopener">
                  <img src="https://kclc.ru/wp-content/uploads/2026/02/%D0%9F%D0%B5%D1%80%D0%B5%D0%B7%D0%B0%D0%B3%D1%80%D1%83%D0%B7%D0%BA%D0%B0-2026.jpg" alt="Перезагрузка 2026">
                    <div class="event-slide-overlay"><span class="event-slide-title">Перезагрузка</span><span class="event-slide-cta">Подробнее <span aria-hidden="true">&#8594;</span></span></div>
              </a>
          </div>
          <div class="event-slide">
              <a href="http://new.kclc.ru/events/siberian-alpha-conference/" target="_blank" rel="noopener">
                  <img src="https://kclc.ru/wp-content/uploads/2026/03/%D0%A1%D0%B8%D0%B1%D0%B8%D1%80%D1%81%D0%BA%D0%B0%D1%8F-%D0%90%D0%BB%D1%8C%D1%84%D0%B0-%D0%BA%D0%BE%D0%BD%D1%84%D0%B5%D1%80%D0%B5%D0%BD%D1%86%D0%B8%D1%8F-2026-%D0%BD%D0%B0-%D1%81%D0%B0%D0%B9%D1%82.jpg" alt="Сибирская Альфа Конференция">
                    <div class="event-slide-overlay"><span class="event-slide-title">Сибирская Альфа Конференция</span><span class="event-slide-cta">Подробнее <span aria-hidden="true">&#8594;</span></span></div>
              </a>
          </div>
        {% endif %}
      </div>
      
      <!-- Dots indicator -->
      <div class="events-dots" id="eventsDots" aria-hidden="true"></div>
      
    </div>
  </div>
</section>
