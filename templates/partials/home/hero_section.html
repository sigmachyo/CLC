{% load static %}
<section class="snap-sec" id="sec-hero" aria-label="Главная">
  
  <div class="snap-sec-inner hero-inner-wrap">
    
    <!-- ====== ФОНОВОЕ ВИДЕО ====== -->
    <div class="hero-video-bg">
      <video autoplay loop muted playsinline preload="auto">
        <source type="video/mp4" src="https://kclc.ru/wp-content/uploads/2024/09/фон-на-сайт.mp4" />
      </video>
      <!-- Плавный градиент для ухода в цвет фона сайта и читаемости -->
      <div class="hero-video-overlay"></div>
    </div>

    <!-- ====== КОНТЕНТ ====== -->
    <div class="hero-content">
        
        <!-- Logo with glow effect -->
        <div class="hero-logo-wrap">
            <div class="hero-logo-glow"></div>
            <img src="{% static 'img/logo.png' %}" alt="KCLC" class="hero-logo-img">
        </div>

        <!-- Mission text -->
        <p class="hero-mission-text">
            «Призвана быть местом проявления Божьего Царства, где каждый человек является частью большой семьи, в которой главенствует Бог»
        </p>

        <!-- Primary Action Button -->
        <a href="#sec-timer" class="hero-primary-btn">
            Смотреть онлайн
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>

    </div>
  </div>
</section>

<style>
#sec-hero {
    background-color: #1a1f36;
    padding: 0 !important;
    margin: 0 !important;
    height: 100vh !important;
    height: 100dvh !important;
    min-height: 100dvh !important;
    overflow: hidden !important;
}
.hero-inner-wrap {
    position: relative;
    overflow: hidden !important;
    padding: 0 !important;
    margin: 0 !important;
    width: 100%;
    height: 100% !important;
    display: flex;
    align-items: center;
    justify-content: center;
}
.hero-video-bg {
    position: absolute;
    inset: 0;
    z-index: 1;
}
.hero-video-bg video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.85; /* Немного прозрачности, чтобы не слепило */
}
.hero-video-overlay {
    position: absolute;
    inset: 0;
    /* Затемняем фон под текстом для лучшей читаемости и делаем плавный переход в цвет следующей секции */
    background: 
        linear-gradient(180deg, rgba(26,31,54,0.3) 0%, rgba(26,31,54,0.6) 60%, #1a1f36 100%),
        linear-gradient(90deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.2) 100%);
}
.hero-content {
    position: relative;
    z-index: 2;
    flex: none;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 0 24px;
}
.hero-logo-wrap {
    position: relative;
    margin-bottom: clamp(32px, 5vh, 48px);
    display: inline-block;
}
.hero-logo-glow {
    position: absolute;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(201,168,76,0.5) 0%, transparent 70%);
    border-radius: 50%;
    filter: blur(40px);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: pulseGlow 4s ease-in-out infinite;
}
.hero-logo-img {
    width: 100%;
    max-width: 220px;
    height: auto;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
    position: relative;
    z-index: 1;
}
.hero-mission-text {
    font-family: 'Public Sans', sans-serif;
    font-size: clamp(1.1rem, 3.5vw, 1.35rem);
    line-height: 1.6;
    opacity: 0.95;
    max-width: 500px;
    font-weight: 400;
    letter-spacing: 0.02em;
    color: #fff;
    margin-bottom: clamp(32px, 5vh, 48px);
    text-shadow: 0 4px 12px rgba(0,0,0,0.8);
}
.hero-primary-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    padding: 16px 36px;
    border-radius: 100px;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    text-decoration: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}
.hero-primary-btn:hover {
    background: rgba(201,168,76,0.9);
    color: #0f1420;
    border-color: transparent;
    box-shadow: 0 15px 40px rgba(201,168,76,0.4);
}
.hero-primary-btn:active {
    transform: scale(0.96);
    box-shadow: 0 5px 15px rgba(201,168,76,0.2);
}
@keyframes pulseGlow {
    0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
}
</style>
