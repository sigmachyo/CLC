{% load static %}
<section class="snap-sec" id="sec-hero" aria-label="Главная" style="background-color: #0f1420;">
  
  <div class="snap-sec-inner" style="position: relative; overflow: hidden; padding: 0;">
    <!-- ====== ФОНОВОЕ ВИДЕО ====== -->
    <div class="hero-video-bg" style="position: absolute; inset: 0; z-index: 1;">
      <video autoplay loop muted playsinline preload="auto" style="width: 100%; height: 100%; object-fit: cover; opacity: 0.85;">
        <source type="video/mp4" src="https://kclc.ru/wp-content/uploads/2024/09/фон-на-сайт.mp4" />
      </video>
      <!-- Плавный градиент для ухода в цвет фона сайта -->
      <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,20,32,0.2) 0%, rgba(15,20,32,0.5) 60%, #0f1420 100%);"></div>
    </div>

    <!-- ====== КОНТЕНТ ====== -->
    <div class="hero-content" style="position: relative; z-index: 2; flex: 1; min-height: 600px; width: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 24px;">
        
        <!-- Logo with glow effect -->
        <div style="position: relative; margin-bottom: 48px; display: inline-block;">
            <div style="position: absolute; width: 160px; height: 160px; background: radial-gradient(circle, rgba(201,168,76,0.2) 0%, transparent 70%); border-radius: 50%; filter: blur(30px); top: 50%; left: 50%; transform: translate(-50%, -50%); animation: pulseGlow 4s ease-in-out infinite;"></div>
            <img src="{% static 'img/logo.png' %}" alt="KCLC" 
                 style="width: 100%; max-width: 220px; height: auto; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); position: relative; z-index: 1;">
        </div>

        <!-- Mission text -->
        <p style="font-family: 'Public Sans', sans-serif; font-size: clamp(1.1rem, 3.5vw, 1.35rem); line-height: 1.6; opacity: 0.9; max-width: 500px; font-weight: 300; letter-spacing: 0.02em; color: #fff; margin-bottom: 48px; text-shadow: 0 4px 12px rgba(0,0,0,0.5);">
            «Призвана быть местом проявления Божьего Царства, где каждый человек является частью большой семьи, в которой главенствует Бог»
        </p>

        <!-- Primary Action Button -->
        <a href="#sec-timer" style="display: inline-flex; align-items: center; justify-content: center; gap: 12px; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 16px 36px; border-radius: 100px; font-weight: 600; font-size: 15px; letter-spacing: 0.05em; text-transform: uppercase; text-decoration: none; box-shadow: 0 10px 30px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); -webkit-tap-highlight-color: transparent;"
           onmouseover="this.style.background='rgba(201,168,76,0.9)'; this.style.color='#0f1420'; this.style.borderColor='transparent'; this.style.boxShadow='0 15px 40px rgba(201,168,76,0.4)';"
           onmouseout="this.style.background='rgba(255, 255, 255, 0.1)'; this.style.color='#fff'; this.style.borderColor='rgba(255,255,255,0.2)'; this.style.boxShadow='0 10px 30px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1)';">
            Смотреть онлайн
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>

    </div>
  </div>
</section>

<style>
@keyframes pulseGlow {
    0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
}
</style>
