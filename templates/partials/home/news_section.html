{% load static %}
<section class="snap-sec" id="sec-news" aria-label="Новости">
  <div class="snap-sec-inner">
    <div class="section-content section-content--news">

      <!-- Заголовок -->
      <div class="news-header">
        <div class="news-header-accent"></div>
        <div class="news-header-text">
          <h2 class="section-heading">Новости церкви</h2>
          <p class="news-header-sub">
            События, обновления и свидетельства нашей общины. Будьте в курсе жизни церкви.
          </p>
        </div>
      </div>

      <!-- Сетка новостей (skeleton-заглушки) -->
      <div class="news-cards-grid" id="news-grid">
        <div class="news-skeleton-card">
          <div class="news-skeleton-inner">
            <div class="news-skeleton-line news-skeleton-line--short"></div>
            <div class="news-skeleton-line news-skeleton-line--full"></div>
            <div class="news-skeleton-line news-skeleton-line--medium"></div>
            <div class="news-skeleton-footer">
              <div class="news-skeleton-line news-skeleton-line--tag"></div>
            </div>
          </div>
        </div>
        <div class="news-skeleton-card">
          <div class="news-skeleton-inner">
            <div class="news-skeleton-line news-skeleton-line--short"></div>
            <div class="news-skeleton-line news-skeleton-line--full"></div>
            <div class="news-skeleton-line news-skeleton-line--medium"></div>
            <div class="news-skeleton-footer">
              <div class="news-skeleton-line news-skeleton-line--tag"></div>
            </div>
          </div>
        </div>
        <div class="news-skeleton-card">
          <div class="news-skeleton-inner">
            <div class="news-skeleton-line news-skeleton-line--short"></div>
            <div class="news-skeleton-line news-skeleton-line--full"></div>
            <div class="news-skeleton-line news-skeleton-line--medium"></div>
            <div class="news-skeleton-footer">
              <div class="news-skeleton-line news-skeleton-line--tag"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Кнопка "Все новости" -->
      <div class="news-action">
        <a href="{% url 'news_list' %}" class="news-all-btn" aria-label="Все новости">
          Все новости
          <span class="material-symbols-outlined news-all-btn-icon">open_in_new</span>
        </a>
      </div>

    </div>
  </div>
</section>
