{% extends 'base.html' %}
{% load static %}

{% block title %}{{ news.title }}{% endblock %}

{% block extra_css %}
<style>
  .news-detail-container {
    max-width: 800px;
    margin: 0 auto;
    padding: 120px 20px 80px;
  }
  
  .news-detail-header {
    text-align: center;
    margin-bottom: 40px;
  }
  
  .news-detail-date {
    color: var(--gold, #c9a84c);
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 16px;
  }
  
  .news-detail-title {
    font-size: 2.5rem;
    font-weight: 700;
    color: var(--txt, #1a1f36);
    margin-bottom: 20px;
    line-height: 1.2;
  }
  
  .news-detail-image {
    width: 100%;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 30px;
  }
  
  .news-detail-image img {
    width: 100%;
    height: auto;
    object-fit: cover;
  }
  
  .news-detail-content {
    color: var(--txt-sub, #3d4260);
    font-size: 1.1rem;
    line-height: 1.8;
  }
  
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 40px;
    color: var(--gold, #c9a84c);
    text-decoration: none;
  }
  
  @media (max-width: 768px) {
    .news-detail-title {
      font-size: 1.8rem;
    }
  }
</style>
{% endblock %}

{% block content %}
<div class="news-detail-container">
  <div class="news-detail-header">
    <div class="news-detail-date">
      <i class="far fa-calendar-alt"></i> {{ news.created_at|date:"d.m.Y" }}
    </div>
    <h1 class="news-detail-title">{{ news.title }}</h1>
  </div>
  
  {% if news.image %}
  <div class="news-detail-image">
    <img src="{{ news.image.url }}" alt="{{ news.title }}">
  </div>
  {% endif %}
  
  <div class="news-detail-content">
    {{ news.content|linebreaks }}
  </div>
  
  <a href="{% url 'news_list' %}" class="back-link">
    ← Назад к новостям
  </a>
</div>
{% endblock %}
