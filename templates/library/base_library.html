{% extends 'base.html' %}
{% load static %}

{% block title %}Библиотека - {{ title|default:'Духовный Путь' }}{% endblock %}

{% block extra_css %}
<style>
    .library-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 100px 20px 80px;
    }
    
    .library-header {
        text-align: center;
        margin-bottom: 50px;
    }
    
    .library-header h1 {
        color: white;
        font-size: 2.5rem;
        margin-bottom: 15px;
    }
    
    .library-header h1 i {
        color: #f1c40f;
        margin-right: 15px;
    }
    
    .library-header p {
        color: rgba(255,255,255,0.8);
        font-size: 1.1rem;
        max-width: 600px;
        margin: 0 auto;
    }
    
    .category-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 30px;
        margin-top: 40px;
    }
    
    .category-card {
        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 30px 20px;
        text-align: center;
        text-decoration: none;
        color: white;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        border: 1px solid rgba(255,255,255,0.1);
    }
    
    .category-card:hover {
        transform: translateY(-10px);
        background: rgba(255,255,255,0.1);
        border-color: #f1c40f;
    }
    
    .category-icon {
        width: 80px;
        height: 80px;
        background: linear-gradient(145deg, #f1c40f, #f39c12);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 2.5rem;
        color: white;
    }
    
    .category-card h3 {
        font-size: 1.4rem;
        margin-bottom: 10px;
    }
    
    .category-card p {
        color: rgba(255,255,255,0.7);
        font-size: 0.9rem;
        line-height: 1.5;
    }
    
    .section-title {
        color: white;
        font-size: 1.8rem;
        margin: 50px 0 30px;
        display: flex;
        align-items: center;
        gap: 15px;
    }
    
    .section-title i {
        color: #f1c40f;
    }
    
    .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 25px;
    }
    
    .content-card {
        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(10px);
        border-radius: 15px;
        overflow: hidden;
        text-decoration: none;
        color: white;
        transition: all 0.3s ease;
        border: 1px solid rgba(255,255,255,0.1);
    }
    
    .content-card:hover {
        transform: translateY(-5px);
        border-color: #f1c40f;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    
    .card-image {
        width: 100%;
        height: 160px;
        background: linear-gradient(145deg, #3498db, #2980b9);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3rem;
        color: white;
        position: relative;
    }
    
    .card-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    
    .card-badge {
        position: absolute;
        top: 10px;
        right: 10px;
        background: #f1c40f;
        color: #2c3e50;
        padding: 5px 10px;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 700;
    }
    
    .card-content {
        padding: 20px;
    }
    
    .card-title {
        font-size: 1.2rem;
        font-weight: 600;
        margin-bottom: 8px;
    }
    
    .card-meta {
        display: flex;
        align-items: center;
        gap: 15px;
        color: rgba(255,255,255,0.6);
        font-size: 0.85rem;
        margin-top: 10px;
    }
    
    .card-meta i {
        margin-right: 5px;
    }
    
    .progress-bar {
        width: 100%;
        height: 6px;
        background: rgba(255,255,255,0.1);
        border-radius: 3px;
        margin-top: 15px;
        overflow: hidden;
    }
    
    .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #f1c40f, #f39c12);
        transition: width 0.3s ease;
    }
    
    @media (max-width: 768px) {
        .library-header h1 {
            font-size: 2rem;
        }
        
        .category-grid {
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .category-icon {
            width: 60px;
            height: 60px;
            font-size: 2rem;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="library-container">
    {% block library_content %}{% endblock %}
</div>
{% endblock %}
