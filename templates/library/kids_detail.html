{% extends 'library/base_library.html' %}
{% block title %}{{ content.title }}{% endblock %}

{% block library_content %}
<div style="max-width: 900px; margin: 0 auto;">

    <h1 style="color: var(--navy); font-size: 2.2rem; font-weight:800; margin-bottom: 24px;">
        {{ content.title }}
    </h1>

    {% if content.video_file %}
    <div style="margin-bottom: 30px; border-radius: 20px; overflow: hidden; background: #000;">
        <video controls style="width: 100%; display: block;">
            <source src="{{ content.video_file.url }}">
        </video>
    </div>
    {% endif %}

    {% if content.get_youtube_embed_url %}
    <div style="margin-bottom: 30px; border-radius: 20px; overflow: hidden;">
        <iframe
            width="100%"
            height="500"
            src="{{ content.get_youtube_embed_url }}"
            title="{{ content.title }}"
            frameborder="0"
            allowfullscreen>
        </iframe>
    </div>
    {% endif %}

    <div style="color: var(--navy-light); line-height: 1.8; font-size: 1.05rem;">
        {{ content.description|linebreaks }}
    </div>

</div>
{% endblock %}
