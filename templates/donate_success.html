{% extends 'base.html' %}

{% block title %}Оплата успешна{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 100px auto 120px; padding: 40px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center;">
    
    <div style="width: 80px; height: 80px; border-radius: 50%; background: rgba(46,204,113,0.1); color: #27ae60; font-size: 2.5rem; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
        <i class="fa-solid fa-check"></i>
    </div>

    <h2 style="color: var(--navy); font-size: 1.8rem; margin-bottom: 15px;">Спасибо за пожертвование!</h2>
    <p style="color: var(--txt-sub); margin-bottom: 30px; line-height: 1.6;">
        Ваш платеж успешно обработан. Пусть Бог обильно благословит вас за ваше доброе сердце и поддержку служения!
    </p>

    <a href="{% url 'home' %}" style="display: inline-block; padding: 12px 30px; background: var(--primary); color: white; text-decoration: none; border-radius: 8px; font-weight: 600;">
        Вернуться на главную
    </a>
</div>
{% endblock %}
